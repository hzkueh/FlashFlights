server {
    # Both families: `localhost` resolves to ::1 inside the container, so an
    # IPv4-only listener answers the gateway but not the healthcheck.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these, so they can be cached hard. index.html cannot be,
    # or a reviewer who redeploys keeps loading the previous build's asset names.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: any path the SPA owns is served the same document,
    # so a deep link like /flights/123 survives a refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
